services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robbia
      POSTGRES_PASSWORD: robbia
      POSTGRES_DB: robbia
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U robbia']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://robbia:robbia@postgres:5432/robbia
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
