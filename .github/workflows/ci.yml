name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint (Biome)
        run: bun run lint
      - name: Typecheck (tsc)
        run: bun run typecheck
      - name: Test (bun test)
        run: bun run test
      - name: Build (turbo)
        run: bun run build
