name: "🐛 Bug report"
description: "Report a problem so we can fix it · Reporte um problema para corrigirmos"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! · Obrigado por reportar um bug!
        ⚠️ **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: "Description · Descrição"
      description: "What happened? · O que aconteceu?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce · Passos para reproduzir"
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior · Comportamento esperado"
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: "Affected component · Componente afetado"
      placeholder: "e.g. apps/web, packages/shared, runtime…"
  - type: textarea
    id: environment
    attributes:
      label: "Environment · Ambiente"
      placeholder: "OS, Bun version (bun --version), browser, Docker version…"
  - type: textarea
    id: logs
    attributes:
      label: "Logs / screenshots"
      description: "⚠️ Redact any secrets before pasting · Redija segredos antes de colar."
      render: shell
